services:
  browser:
    build: .
    init: true
    restart: unless-stopped
    env_file: [.browser.env]
    user: pwuser
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    shm_size: 512m
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/pwuser:size=128m,mode=0700,uid=1000,gid=1000
