name: beepnado
services:
  web:
    build: .
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment:
      DATABASE_PATH: /data/beepnado.sqlite3
    # Local health/debug only. Caddy reaches the container over portfolio_default.
    ports:
      - '127.0.0.1:8490:8000'
    networks:
      - default
      - caddy
    volumes:
      - data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ['CMD','python','-c','import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health",timeout=3)']
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  caddy:
    name: portfolio_default
    external: true
volumes:
  data:
