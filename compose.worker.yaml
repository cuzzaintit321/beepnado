name: beepnado-outside
services:
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .worker.env
    init: true
    restart: unless-stopped
    volumes:
      - worker-state:/data
    cap_drop: [ALL]
    sysctls:
      net.ipv4.ping_group_range: "10002 10002"
    security_opt: [no-new-privileges:true]
volumes:
  worker-state:
